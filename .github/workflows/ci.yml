name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '0 5 * * 1'   # weekly rebuild refreshes live stats (Thunderstore etc.)

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the production image
        run: ./ops.sh test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: site/playwright-report }

  # Off until the repo variable DEPLOY_ENABLED is true (Settings > Secrets and variables > Actions > Variables)
  # and the DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY secrets exist; until then it shows as skipped, not failed.
  deploy:
    needs: build-test
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: cd ~/projects/portfolio && git pull --ff-only && ./ops.sh deploy
